# Included inside the HTTP staging or HTTPS server block.
root /srv/safspp/public;
index index.html;
server_tokens off;
client_max_body_size 1m;
client_body_timeout 15s;
send_timeout 30s;
disable_symlinks on;
access_log /var/log/nginx/safspp-access.log safspp_safe;
error_log /var/log/nginx/safspp-error.log warn;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
# Existing public homepage uses inline JS/CSS. No external resources are permitted.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
    try_files $uri =404;
    access_log off;
}
location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
location ~ /\. { return 404; }
location = /portal { return 404; }
location ^~ /portal/ { return 404; }
location = /static { return 301 /static/; }
location ^~ /static/ {
    alias /srv/safspp/static/;
    expires 1h;
}
location ^~ /assets/ {
    expires 1h;
    try_files $uri =404;
}
# Public releases only. Administrative editorial endpoints stay on the application host.
location ~ ^/(api/public/editorial/site/[a-z0-9_/-]+|editorial-images/[a-f0-9-]+)/$ {
    limit_except GET { deny all; }
    proxy_pass https://app.migrantmost.ru;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host app.migrantmost.ru;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 4s;
    proxy_read_timeout 8s;
}
location = /concept.pdf { expires 1h; try_files $uri =404; }
location = / { expires -1; try_files /index.html =404; }
location = /index.html { expires -1; try_files $uri =404; }
# Default-deny all other source-looking paths, including /portal/, .env and .git.
location / { return 404; }
