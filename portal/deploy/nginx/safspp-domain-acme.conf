# Inert until explicitly installed/enabled after DNS ownership is confirmed.
# Optional www may be added here only after its DNS has also been verified.
server {
    listen 80;
    listen [::]:80;
    server_name migrantmost.ru;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "Secure website is being prepared. Please return after HTTPS is enabled.\n";
    }
}
