# Optional: append only after both DNS and the certificate cover www.migrantmost.ru.
server {
    listen 80;
    listen [::]:80;
    server_name www.migrantmost.ru;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://migrantmost.ru$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.migrantmost.ru;
    ssl_certificate /etc/letsencrypt/live/safspp-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safspp-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SAFSPP_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    access_log off;
    return 308 https://migrantmost.ru$request_uri;
}
