# Before certificate issuance only. Credentials/intake never travel over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name 194.58.103.10;
    include /etc/nginx/snippets/safspp-common.conf;
    location ~ ^/(login|logout|signup|cases|partners|admin|healthz)(/|$) {
        access_log off;
        default_type text/plain;
        return 503 "Secure portal is being prepared. Please return after HTTPS is enabled.\n";
    }
}
