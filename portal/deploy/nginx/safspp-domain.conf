# SAFSPP domain mode: migrantmost.ru is the canonical public site.
# Load the IP TLS server first: direct IP clients can omit SNI.
include /etc/nginx/sites-available/safspp-ip-fallback.conf;

server {
    listen 80;
    listen [::]:80;
    server_name migrantmost.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }
    location / { return 308 https://migrantmost.ru$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name migrantmost.ru;
    ssl_certificate /etc/letsencrypt/live/safspp-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safspp-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SAFSPP_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/snippets/safspp-common.conf;
    location ~ ^/(login|logout|signup|cases|partners|admin|healthz)(/|$) {
        # Avoid logging invitation tokens, case identifiers, query strings or referrers.
        access_log off;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
        proxy_hide_header Cache-Control;
        # Repeating security headers preserves them when add_header is used here.
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}

